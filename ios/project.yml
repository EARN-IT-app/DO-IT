# Xcode project for DO IT for iPhone. GitHub turns this into DOIT.xcodeproj
# (with XcodeGen) so it can be opened in Xcode with a double-click.
name: DOIT
options:
  bundleIdPrefix: io.github.wonderbread4912
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  DOIT:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DO IT
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/DOIT.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.io.github.wonderbread4912.doit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wonderbread4912.doit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DOITMonitor
      - target: DOITShield
      - target: DOITShieldAction

  DOITMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: DO IT Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.io.github.wonderbread4912.doit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wonderbread4912.doit.monitor

  DOITShield:
    type: app-extension
    platform: iOS
    sources: [Shield]
    info:
      path: Shield/Info.plist
      properties:
        CFBundleDisplayName: DO IT Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
    entitlements:
      path: Shield/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.io.github.wonderbread4912.doit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wonderbread4912.doit.shield

  DOITShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: DO IT Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActions
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.io.github.wonderbread4912.doit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wonderbread4912.doit.shieldaction
