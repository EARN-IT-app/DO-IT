# Builds the DO IT Mac app for free on GitHub's Macs and posts it as a download
# on the repository's Releases page (tag: mac-latest).
name: Build Mac app

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile for Apple chips and Intel chips
        run: |
          swiftc -O -target arm64-apple-macos13 mac/main.swift -o DOIT-arm64
          swiftc -O -target x86_64-apple-macos13 mac/main.swift -o DOIT-x86_64
          lipo -create DOIT-arm64 DOIT-x86_64 -output DOIT

      - name: Make the app icon
        run: |
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d icon.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Put the app together
        run: |
          APP="DO IT.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp DOIT "$APP/Contents/MacOS/DOIT"
          cp mac/Info.plist "$APP/Contents/Info.plist"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" DO-IT-for-Mac.zip

      - name: Post it on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-latest >/dev/null 2>&1 || \
            gh release create mac-latest --title "DO IT for Mac" \
              --notes "Download DO-IT-for-Mac.zip below, open it, and drag DO IT into your Applications folder."
          gh release upload mac-latest DO-IT-for-Mac.zip --clobber
